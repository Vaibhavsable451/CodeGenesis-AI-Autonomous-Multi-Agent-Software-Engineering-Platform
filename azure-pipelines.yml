# Azure DevOps Pipeline (azure-pipelines.yml)
# Build and Push Docker images to Azure Container Registry (ACR)

trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

variables:
  # Configure this in Azure DevOps Service Connection or Library Variable Group
  dockerRegistryServiceConnection: 'acr-service-connection'
  acrLoginServer: '$(ACR_NAME).azurecr.io'
  appImageName: 'codegenesis-app'
  sandboxImageName: 'codegenesis-sandbox'

stages:
- stage: Test
  displayName: 'Run Tests & Lint'
  jobs:
  - job: PythonTest
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.11'
    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov ruff
        ruff check . --exit-zero
        python -m pytest tests/ -q
      displayName: 'Install deps & run pytest'

- stage: BuildAndPush
  displayName: 'Build & Push Docker Images'
  dependsOn: Test
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: DockerBuild
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Docker@2
      displayName: 'Build & Push Sandbox Image'
      inputs:
        command: buildAndPush
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: $(sandboxImageName)
        dockerfile: 'infrastructure/sandbox.Dockerfile'
        tags: |
          latest
          $(Build.BuildId)

    - task: Docker@2
      displayName: 'Build & Push App Image'
      inputs:
        command: buildAndPush
        containerRegistry: $(dockerRegistryServiceConnection)
        repository: $(appImageName)
        dockerfile: 'Dockerfile'
        tags: |
          latest
          $(Build.BuildId)
